<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投注盈亏模拟器</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --panel: #ffffff;
      --ink: #202421;
      --muted: #657069;
      --line: #dce2dd;
      --accent: #0f7a68;
      --accent-dark: #0a5c50;
      --warn: #a33d2d;
      --good-bg: #e7f5ee;
      --bad-bg: #f9e8e5;
      --shadow: 0 8px 24px rgba(23, 36, 30, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.45;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 680px;
    }

    .total-stake {
      min-width: 170px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      border-radius: 8px;
      text-align: right;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .amount {
      font-size: 26px;
      font-weight: 750;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 440px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0;
      padding: 16px 18px;
      font-size: 18px;
      border-bottom: 1px solid var(--line);
    }

    .inputs {
      padding: 16px 18px 18px;
      display: grid;
      gap: 14px;
    }

    .match {
      display: grid;
      grid-template-columns: 1fr 86px 86px;
      gap: 10px;
      align-items: end;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .match:last-of-type {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .match-name {
      font-weight: 700;
      min-width: 0;
    }

    .teams {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    input[type="number"] {
      width: 86px;
      height: 42px;
      border: 1px solid #c8d1ca;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      background: #fbfcfb;
    }

    input[type="number"]:focus {
      outline: 2px solid rgba(15, 122, 104, 0.22);
      border-color: var(--accent);
    }

    .score-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
      display: block;
      white-space: nowrap;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 4px 0 0;
      font-weight: 700;
    }

    .stake-editor {
      padding: 16px 0 4px;
      border-top: 1px solid var(--line);
    }

    .stake-editor h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .stake-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 12px;
    }

    .stake-card {
      display: grid;
      gap: 9px;
      min-width: 0;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfb;
    }

    .stake-card .score-label {
      margin-bottom: 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
    }

    .stake-field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .stake-input {
      width: 100%;
      min-width: 0;
      height: 40px;
      padding: 8px 9px;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 6px;
      min-height: 42px;
      padding: 10px 14px;
      font-weight: 750;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      color: var(--ink);
      background: #e9eee9;
      border: 1px solid var(--line);
    }

    button.secondary:hover {
      background: #dde5df;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 14px;
      background: #fbfcfb;
      min-width: 0;
    }

    .metric strong {
      display: block;
      font-size: 24px;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      overflow-x: visible;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 0;
    }

    th,
    td {
      padding: 13px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      background: #fbfcfb;
      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    th:nth-child(1),
    td:nth-child(1) {
      width: 74px;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 112px;
    }

    th:nth-child(3),
    td:nth-child(3),
    th:nth-child(4),
    td:nth-child(4),
    th:nth-child(5),
    td:nth-child(5) {
      width: 92px;
      white-space: nowrap;
    }

    .details-cell {
      min-width: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 13px;
      font-weight: 750;
    }

    .hit {
      color: #0d604e;
      background: var(--good-bg);
    }

    .miss {
      color: var(--warn);
      background: var(--bad-bg);
    }

    .profit {
      color: #0d604e;
      font-weight: 750;
    }

    .loss {
      color: var(--warn);
      font-weight: 750;
    }

    .condition-list {
      display: grid;
      gap: 3px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .condition-list li {
      margin: 0;
    }

    .condition-item {
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .condition-item.hit {
      color: #0d604e;
      background: transparent;
      font-weight: 750;
    }

    .condition-item.miss {
      color: var(--warn);
      background: transparent;
      font-weight: 750;
    }

    .condition-text {
      min-width: 0;
    }

    .condition-result {
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      header,
      .layout {
        grid-template-columns: 1fr;
      }

      header {
        display: grid;
        align-items: start;
      }

      .total-stake {
        text-align: left;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100vw - 20px, 1180px);
        padding-top: 18px;
      }

      .match {
        grid-template-columns: 1fr 76px 76px;
      }

      input[type="number"] {
        width: 76px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .stake-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      table,
      thead,
      tbody,
      tr,
      th,
      td {
        display: block;
        width: 100%;
      }

      thead {
        display: none;
      }

      tbody tr {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      tbody tr:last-child {
        border-bottom: 0;
      }

      td {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 10px;
        padding: 7px 0;
        border-bottom: 0;
      }

      td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 13px;
        font-weight: 750;
      }

      td.details-cell {
        display: block;
        padding-top: 10px;
      }

      td.details-cell::before {
        display: block;
        margin-bottom: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>投注盈亏模拟器</h1>
        <p class="subtitle">输入最终比分后自动判断 6 张串关是否全中，并计算返还金额与总净盈亏。</p>
      </div>
      <div class="total-stake">
        <span class="label">总本金</span>
        <span class="amount" id="topStake">$0.00</span>
      </div>
    </header>

    <section class="layout">
      <div class="panel">
        <h2>比分输入</h2>
        <div class="inputs">
          <div class="match">
            <div>
              <div class="match-name">南非 vs 加拿大</div>
              <div class="teams">南非进球 / 加拿大进球</div>
            </div>
            <label>
              <span class="score-label">南非</span>
              <input id="southAfricaFor" type="number" min="0" max="30" value="0">
            </label>
            <label>
              <span class="score-label">加拿大</span>
              <input id="southAfricaAgainst" type="number" min="0" max="30" value="0">
            </label>
          </div>

          <div class="match">
            <div>
              <div class="match-name">巴西 vs 日本</div>
              <div class="teams">巴西进球 / 日本进球</div>
            </div>
            <label>
              <span class="score-label">巴西</span>
              <input id="brazilFor" type="number" min="0" max="30" value="0">
            </label>
            <label>
              <span class="score-label">日本</span>
              <input id="brazilAgainst" type="number" min="0" max="30" value="0">
            </label>
          </div>

          <div class="match">
            <div>
              <div class="match-name">德国 vs 巴拉圭</div>
              <div class="teams">德国进球 / 巴拉圭进球</div>
            </div>
            <label>
              <span class="score-label">德国</span>
              <input id="germanyFor" type="number" min="0" max="30" value="0">
            </label>
            <label>
              <span class="score-label">巴拉圭</span>
              <input id="germanyAgainst" type="number" min="0" max="30" value="0">
            </label>
          </div>

          <div class="match">
            <div>
              <div class="match-name">荷兰 vs 摩洛哥</div>
              <div class="teams">荷兰进球 / 摩洛哥进球</div>
            </div>
            <label>
              <span class="score-label">荷兰</span>
              <input id="netherlandsFor" type="number" min="0" max="30" value="0">
            </label>
            <label>
              <span class="score-label">摩洛哥</span>
              <input id="netherlandsAgainst" type="number" min="0" max="30" value="0">
            </label>
          </div>

          <div class="stake-editor">
            <h3>每张票本金和赔率</h3>
            <div class="stake-grid">
              <div class="stake-card">
                <span class="score-label">第一串</span>
                <label class="stake-field">
                  <span class="field-label">本金</span>
                  <input class="stake-input" id="stake1" type="number" min="0" step="0.01" value="0" placeholder="本金" title="第一串 本金">
                </label>
                <label class="stake-field">
                  <span class="field-label">赔率</span>
                  <input class="stake-input" id="odds1" type="number" min="0" step="0.001" value="6.80" placeholder="赔率" title="第一串 赔率">
                </label>
              </div>
              <div class="stake-card">
                <span class="score-label">第二串</span>
                <label class="stake-field">
                  <span class="field-label">本金</span>
                  <input class="stake-input" id="stake2" type="number" min="0" step="0.01" value="0" placeholder="本金" title="第二串 本金">
                </label>
                <label class="stake-field">
                  <span class="field-label">赔率</span>
                  <input class="stake-input" id="odds2" type="number" min="0" step="0.001" value="4.76" placeholder="赔率" title="第二串 赔率">
                </label>
              </div>
              <div class="stake-card">
                <span class="score-label">第三串</span>
                <label class="stake-field">
                  <span class="field-label">本金</span>
                  <input class="stake-input" id="stake3" type="number" min="0" step="0.01" value="0" placeholder="本金" title="第三串 本金">
                </label>
                <label class="stake-field">
                  <span class="field-label">赔率</span>
                  <input class="stake-input" id="odds3" type="number" min="0" step="0.001" value="7.015" placeholder="赔率" title="第三串 赔率">
                </label>
              </div>
              <div class="stake-card">
                <span class="score-label">第五串</span>
                <label class="stake-field">
                  <span class="field-label">本金</span>
                  <input class="stake-input" id="stake5" type="number" min="0" step="0.01" value="0" placeholder="本金" title="第五串 本金">
                </label>
                <label class="stake-field">
                  <span class="field-label">赔率</span>
                  <input class="stake-input" id="odds5" type="number" min="0" step="0.001" value="3.174" placeholder="赔率" title="第五串 赔率">
                </label>
              </div>
              <div class="stake-card">
                <span class="score-label">第七串</span>
                <label class="stake-field">
                  <span class="field-label">本金</span>
                  <input class="stake-input" id="stake7" type="number" min="0" step="0.01" value="0" placeholder="本金" title="第七串 本金">
                </label>
                <label class="stake-field">
                  <span class="field-label">赔率</span>
                  <input class="stake-input" id="odds7" type="number" min="0" step="0.001" value="6.91" placeholder="赔率" title="第七串 赔率">
                </label>
              </div>
              <div class="stake-card">
                <span class="score-label">第八串</span>
                <label class="stake-field">
                  <span class="field-label">本金</span>
                  <input class="stake-input" id="stake8" type="number" min="0" step="0.01" value="0" placeholder="本金" title="第八串 本金">
                </label>
                <label class="stake-field">
                  <span class="field-label">赔率</span>
                  <input class="stake-input" id="odds8" type="number" min="0" step="0.001" value="8.96" placeholder="赔率" title="第八串 赔率">
                </label>
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="calculateBtn" type="button">重新计算</button>
            <button class="secondary" id="resetBtn" type="button">清空比分</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>结算结果</h2>
        <div class="summary">
          <div class="metric">
            <span class="label">总本金</span>
            <strong id="stakeMetric">$0.00</strong>
          </div>
          <div class="metric">
            <span class="label">总返还</span>
            <strong id="returnMetric">$0.00</strong>
          </div>
          <div class="metric">
            <span class="label">总净盈亏</span>
            <strong id="netMetric" class="loss">$0.00</strong>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>票</th>
                <th>条件是否全中</th>
                <th>返还金额</th>
                <th>本金</th>
                <th>净盈亏</th>
                <th>条件明细</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const tickets = [
      {
        name: "第一串",
        stakeId: "stake1",
        oddsId: "odds1",
        odds: 6.80,
        conditions: (m) => [
          ["德国 -2 平", handicapDraw(m.germany, -2)],
          ["摩洛哥 +1 胜", handicapWin(m.morocco, 1)]
        ]
      },
      {
        name: "第二串",
        stakeId: "stake2",
        oddsId: "odds2",
        odds: 4.76,
        conditions: (m) => [
          ["南非 vs 加拿大全场总进球 1-4", between(totalGoals(m.southAfrica), 1, 4)],
          ["荷兰 vs 摩洛哥全场总进球 1-3", between(totalGoals(m.netherlands), 1, 3)],
          ["德国独赢", win(m.germany)],
          ["德国 vs 巴拉圭全场总进球 1-4", between(totalGoals(m.germany), 1, 4)],
          ["巴西独赢", win(m.brazil)],
          ["巴西 vs 日本全场总进球 1-5", between(totalGoals(m.brazil), 1, 5)]
        ]
      },
      {
        name: "第三串",
        stakeId: "stake3",
        oddsId: "odds3",
        odds: 7.015,
        conditions: (m) => [
          ["巴西 -1 胜", handicapWin(m.brazil, -1)],
          ["德国 -1 胜", handicapWin(m.germany, -1)],
          ["荷兰 +1 胜", handicapWin(m.netherlands, 1)]
        ]
      },
      {
        name: "第五串",
        stakeId: "stake5",
        oddsId: "odds5",
        odds: 3.174,
        conditions: (m) => [
          ["加拿大 +1 胜", handicapWin(m.canada, 1)],
          ["巴西独赢", win(m.brazil)],
          ["德国独赢", win(m.germany)],
          ["荷兰 +1 胜", handicapWin(m.netherlands, 1)]
        ]
      },
      {
        name: "第七串",
        stakeId: "stake7",
        oddsId: "odds7",
        odds: 6.91,
        conditions: (m) => [
          ["加拿大独赢", win(m.canada)],
          ["巴西 胜", win(m.brazil)],
          ["德国 -1 胜", handicapWin(m.germany, -1)],
          ["荷兰 +1 胜", handicapWin(m.netherlands, 1)]
        ]
      },
      {
        name: "第八串",
        stakeId: "stake8",
        oddsId: "odds8",
        odds: 8.96,
        conditions: (m) => [
          ["加拿大独赢", win(m.canada)],
          ["巴西 胜", win(m.brazil)],
          ["德国 -1 胜", handicapWin(m.germany, -1)],
          ["摩洛哥 +1 胜", handicapWin(m.morocco, 1)]
        ]
      }
    ];

    const fields = [
      "southAfricaFor", "southAfricaAgainst",
      "brazilFor", "brazilAgainst",
      "germanyFor", "germanyAgainst",
      "netherlandsFor", "netherlandsAgainst"
    ];

    const stakeFields = tickets.map((ticket) => ticket.stakeId);
    const oddsFields = tickets.map((ticket) => ticket.oddsId);

    function numberFrom(id) {
      const element = document.getElementById(id);
      const value = Number.parseInt(element.value, 10);
      return Number.isFinite(value) && value >= 0 ? value : 0;
    }

    function stakeFrom(id) {
      const element = document.getElementById(id);
      const value = Number.parseFloat(element.value);
      return Number.isFinite(value) && value >= 0 ? value : 0;
    }

    function oddsFrom(ticket) {
      const element = document.getElementById(ticket.oddsId);
      const value = Number.parseFloat(element.value);
      return Number.isFinite(value) && value >= 0 ? value : ticket.odds;
    }

    function getMatches() {
      const southAfricaFor = numberFrom("southAfricaFor");
      const southAfricaAgainst = numberFrom("southAfricaAgainst");
      const brazilFor = numberFrom("brazilFor");
      const brazilAgainst = numberFrom("brazilAgainst");
      const germanyFor = numberFrom("germanyFor");
      const germanyAgainst = numberFrom("germanyAgainst");
      const netherlandsFor = numberFrom("netherlandsFor");
      const netherlandsAgainst = numberFrom("netherlandsAgainst");

      return {
        southAfrica: { for: southAfricaFor, against: southAfricaAgainst },
        canada: { for: southAfricaAgainst, against: southAfricaFor },
        brazil: { for: brazilFor, against: brazilAgainst },
        japan: { for: brazilAgainst, against: brazilFor },
        germany: { for: germanyFor, against: germanyAgainst },
        paraguay: { for: germanyAgainst, against: germanyFor },
        netherlands: { for: netherlandsFor, against: netherlandsAgainst },
        morocco: { for: netherlandsAgainst, against: netherlandsFor }
      };
    }

    function win(match) {
      return match.for > match.against;
    }

    function draw(match) {
      return match.for === match.against;
    }

    function handicapWin(match, handicap) {
      return match.for + handicap > match.against;
    }

    function handicapDraw(match, handicap) {
      return match.for + handicap === match.against;
    }

    function totalGoals(match) {
      return match.for + match.against;
    }

    function between(value, low, high) {
      return value >= low && value <= high;
    }

    function money(value) {
      const prefix = value < 0 ? "-" : "";
      return `${prefix}$${Math.abs(value).toFixed(2)}`;
    }

    function statusBadge(hit) {
      return `<span class="status ${hit ? "hit" : "miss"}">${hit ? "命中" : "未中"}</span>`;
    }

    function conditionDetails(conditions) {
      const items = conditions
        .map(([label, hit]) => `
          <li class="condition-item ${hit ? "hit" : "miss"}">
            <span class="condition-text">${label}: </span>
            <span class="condition-result">${hit ? "命中 ✓" : "未中 ✕"}</span>
          </li>
        `)
        .join("");
      return `<ul class="condition-list">${items}</ul>`;
    }

    function render() {
      const matches = getMatches();
      const rows = [];
      let totalStake = 0;
      let totalReturn = 0;

      tickets.forEach((ticket) => {
        const stake = stakeFrom(ticket.stakeId);
        const odds = oddsFrom(ticket);
        const conditions = ticket.conditions(matches);
        const allHit = conditions.every((condition) => condition[1]);
        const returnAmount = allHit ? stake * odds : 0;
        const net = returnAmount - stake;

        totalStake += stake;
        totalReturn += returnAmount;
        rows.push(`
          <tr>
            <td data-label="票"><strong>${ticket.name}</strong></td>
            <td data-label="条件是否全中">${statusBadge(allHit)}</td>
            <td data-label="返还金额">${money(returnAmount)}</td>
            <td data-label="本金">${money(stake)}</td>
            <td data-label="净盈亏" class="${net >= 0 ? "profit" : "loss"}">${money(net)}</td>
            <td data-label="条件明细" class="details-cell">${conditionDetails(conditions)}</td>
          </tr>
        `);
      });

      const totalNet = totalReturn - totalStake;
      document.getElementById("resultsBody").innerHTML = rows.join("");
      document.getElementById("topStake").textContent = money(totalStake);
      document.getElementById("stakeMetric").textContent = money(totalStake);
      document.getElementById("returnMetric").textContent = money(totalReturn);
      document.getElementById("netMetric").textContent = money(totalNet);
      document.getElementById("netMetric").className = totalNet >= 0 ? "profit" : "loss";
    }

    function resetScores() {
      fields.forEach((id) => {
        document.getElementById(id).value = 0;
      });
      render();
    }

    fields.forEach((id) => {
      document.getElementById(id).addEventListener("input", render);
    });
    stakeFields.forEach((id) => {
      document.getElementById(id).addEventListener("input", render);
    });
    oddsFields.forEach((id) => {
      document.getElementById(id).addEventListener("input", render);
    });
    document.getElementById("calculateBtn").addEventListener("click", render);
    document.getElementById("resetBtn").addEventListener("click", resetScores);

    render();
  </script>
</body>
</html>
