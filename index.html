<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投注盈亏模拟器</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --panel: #ffffff;
      --ink: #202421;
      --muted: #657069;
      --line: #dce2dd;
      --accent: #0f7a68;
      --accent-dark: #0a5c50;
      --warn: #a33d2d;
      --good-bg: #e7f5ee;
      --bad-bg: #f9e8e5;
      --shadow: 0 8px 24px rgba(23, 36, 30, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.45;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 680px;
    }

    .total-stake {
      min-width: 170px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      border-radius: 8px;
      text-align: right;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .amount {
      font-size: 26px;
      font-weight: 750;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 440px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0;
      padding: 16px 18px;
      font-size: 18px;
      border-bottom: 1px solid var(--line);
    }

    .inputs {
      padding: 16px 18px 18px;
      display: grid;
      gap: 14px;
    }

    .match {
      display: grid;
      grid-template-columns: 1fr 86px 86px;
      gap: 10px;
      align-items: end;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .match:last-of-type {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .match-name {
      font-weight: 700;
      min-width: 0;
    }

    .teams {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    input[type="number"] {
      width: 86px;
      height: 42px;
      border: 1px solid #c8d1ca;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      background: #fbfcfb;
    }

    input[type="number"]:focus {
      outline: 2px solid rgba(15, 122, 104, 0.22);
      border-color: var(--accent);
    }

    .score-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
      display: block;
      white-space: nowrap;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 4px 0 0;
      font-weight: 700;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 6px;
      min-height: 42px;
      padding: 10px 14px;
      font-weight: 750;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      color: var(--ink);
      background: #e9eee9;
      border: 1px solid var(--line);
    }

    button.secondary:hover {
      background: #dde5df;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px 14px;
      background: #fbfcfb;
      min-width: 0;
    }

    .metric strong {
      display: block;
      font-size: 24px;
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
    }

    th,
    td {
      padding: 13px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      background: #fbfcfb;
      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 13px;
      font-weight: 750;
    }

    .hit {
      color: #0d604e;
      background: var(--good-bg);
    }

    .miss {
      color: var(--warn);
      background: var(--bad-bg);
    }

    .profit {
      color: #0d604e;
      font-weight: 750;
    }

    .loss {
      color: var(--warn);
      font-weight: 750;
    }

    details {
      max-width: 420px;
      color: var(--muted);
    }

    summary {
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    .condition-list {
      margin: 8px 0 0;
      padding-left: 18px;
    }

    .condition-list li {
      margin: 3px 0;
    }

    @media (max-width: 900px) {
      header,
      .layout {
        grid-template-columns: 1fr;
      }

      header {
        display: grid;
        align-items: start;
      }

      .total-stake {
        text-align: left;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100vw - 20px, 1180px);
        padding-top: 18px;
      }

      .match {
        grid-template-columns: 1fr 76px 76px;
      }

      input[type="number"] {
        width: 76px;
      }

      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>投注盈亏模拟器</h1>
        <p class="subtitle">输入最终比分后自动判断 5 张串关是否全中，并计算返还金额与总净盈亏。</p>
      </div>
      <div class="total-stake">
        <span class="label">总本金</span>
        <span class="amount" id="topStake">$34.05</span>
      </div>
    </header>

    <section class="layout">
      <div class="panel">
        <h2>比分输入</h2>
        <div class="inputs">
          <div class="match">
            <div>
              <div class="match-name">葡萄牙 vs 对手</div>
              <div class="teams">葡萄牙进球 / 对手进球</div>
            </div>
            <label>
              <span class="score-label">葡萄牙</span>
              <input id="portugalFor" type="number" min="0" max="30" value="0">
            </label>
            <label>
              <span class="score-label">对手</span>
              <input id="portugalAgainst" type="number" min="0" max="30" value="0">
            </label>
          </div>

          <div class="match">
            <div>
              <div class="match-name">阿根廷 vs 对手</div>
              <div class="teams">阿根廷进球 / 对手进球</div>
            </div>
            <label>
              <span class="score-label">阿根廷</span>
              <input id="argentinaFor" type="number" min="0" max="30" value="0">
            </label>
            <label>
              <span class="score-label">对手</span>
              <input id="argentinaAgainst" type="number" min="0" max="30" value="0">
            </label>
          </div>

          <div class="match">
            <div>
              <div class="match-name">英格兰 vs 巴拿马</div>
              <div class="teams">英格兰进球 / 巴拿马进球</div>
            </div>
            <label>
              <span class="score-label">英格兰</span>
              <input id="englandFor" type="number" min="0" max="30" value="0">
            </label>
            <label>
              <span class="score-label">巴拿马</span>
              <input id="englandAgainst" type="number" min="0" max="30" value="0">
            </label>
          </div>

          <div class="match">
            <div>
              <div class="match-name">刚果 vs 乌兹别克斯坦</div>
              <div class="teams">刚果进球 / 乌兹别克斯坦进球</div>
            </div>
            <label>
              <span class="score-label">刚果</span>
              <input id="congoFor" type="number" min="0" max="30" value="0">
            </label>
            <label>
              <span class="score-label">乌兹</span>
              <input id="congoAgainst" type="number" min="0" max="30" value="0">
            </label>
          </div>

          <div class="match">
            <div>
              <div class="match-name">克罗地亚 vs 加纳</div>
              <div class="teams">克罗地亚进球 / 加纳进球</div>
            </div>
            <label>
              <span class="score-label">克罗地亚</span>
              <input id="croatiaFor" type="number" min="0" max="30" value="0">
            </label>
            <label>
              <span class="score-label">加纳</span>
              <input id="croatiaAgainst" type="number" min="0" max="30" value="0">
            </label>
          </div>

          <label class="checkbox-row">
            <input id="messiScored" type="checkbox">
            梅西任何时间进球
          </label>

          <div class="actions">
            <button id="calculateBtn" type="button">重新计算</button>
            <button class="secondary" id="resetBtn" type="button">清空比分</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>结算结果</h2>
        <div class="summary">
          <div class="metric">
            <span class="label">总本金</span>
            <strong id="stakeMetric">$34.05</strong>
          </div>
          <div class="metric">
            <span class="label">总返还</span>
            <strong id="returnMetric">$0.00</strong>
          </div>
          <div class="metric">
            <span class="label">总净盈亏</span>
            <strong id="netMetric" class="loss">-$34.05</strong>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>票</th>
                <th>条件是否全中</th>
                <th>返还金额</th>
                <th>本金</th>
                <th>净盈亏</th>
                <th>条件明细</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const TOTAL_STAKE = 34.05;

    const tickets = [
      {
        name: "票1",
        stake: 10,
        odds: 2.30,
        conditions: (m, messi) => [
          ["葡萄牙 +1 胜", handicapWin(m.portugal, 1)],
          ["阿根廷 -1 赢", handicapWin(m.argentina, -1)],
          ["英格兰赢", win(m.england)]
        ]
      },
      {
        name: "票2",
        stake: 5,
        odds: 3.90,
        conditions: (m, messi) => [
          ["英格兰赢", win(m.england)],
          ["英格兰 vs 巴拿马总进球 2-5", between(totalGoals(m.england), 2, 5)],
          ["刚果赢", win(m.congo)],
          ["刚果 vs 乌兹别克斯坦总进球 1-4", between(totalGoals(m.congo), 1, 4)],
          ["克罗地亚全队进球 1-3", between(m.croatia.for, 1, 3)]
        ]
      },
      {
        name: "票3",
        stake: 12.05,
        odds: 3.07,
        conditions: (m, messi) => [
          ["克罗地亚 +1 赢", handicapWin(m.croatia, 1)],
          ["英格兰 +1 赢", handicapWin(m.england, 1)],
          ["葡萄牙 +1", handicapWin(m.portugal, 1)],
          ["刚果赢", win(m.congo)],
          ["阿根廷赢", win(m.argentina)]
        ]
      },
      {
        name: "票4",
        stake: 4,
        odds: 13.87,
        conditions: (m, messi) => [
          ["英格兰 -1 赢", handicapWin(m.england, -1)],
          ["克罗地亚赢", win(m.croatia)],
          ["葡萄牙赢", win(m.portugal)],
          ["刚果赢", win(m.congo)],
          ["阿根廷 -1 赢", handicapWin(m.argentina, -1)]
        ]
      },
      {
        name: "票5",
        stake: 3,
        odds: 2.50,
        conditions: (m, messi) => [
          ["阿根廷 -1 赢", handicapWin(m.argentina, -1)],
          ["阿根廷全队进球 2-4", between(m.argentina.for, 2, 4)],
          ["梅西任何时间进球", messi]
        ]
      }
    ];

    const fields = [
      "portugalFor", "portugalAgainst",
      "argentinaFor", "argentinaAgainst",
      "englandFor", "englandAgainst",
      "congoFor", "congoAgainst",
      "croatiaFor", "croatiaAgainst"
    ];

    function numberFrom(id) {
      const element = document.getElementById(id);
      const value = Number.parseInt(element.value, 10);
      return Number.isFinite(value) && value >= 0 ? value : 0;
    }

    function getMatches() {
      return {
        portugal: { for: numberFrom("portugalFor"), against: numberFrom("portugalAgainst") },
        argentina: { for: numberFrom("argentinaFor"), against: numberFrom("argentinaAgainst") },
        england: { for: numberFrom("englandFor"), against: numberFrom("englandAgainst") },
        congo: { for: numberFrom("congoFor"), against: numberFrom("congoAgainst") },
        croatia: { for: numberFrom("croatiaFor"), against: numberFrom("croatiaAgainst") }
      };
    }

    function win(match) {
      return match.for > match.against;
    }

    function handicapWin(match, handicap) {
      return match.for + handicap > match.against;
    }

    function totalGoals(match) {
      return match.for + match.against;
    }

    function between(value, low, high) {
      return value >= low && value <= high;
    }

    function money(value) {
      const prefix = value < 0 ? "-" : "";
      return `${prefix}$${Math.abs(value).toFixed(2)}`;
    }

    function statusBadge(hit) {
      return `<span class="status ${hit ? "hit" : "miss"}">${hit ? "命中" : "未中"}</span>`;
    }

    function conditionDetails(conditions) {
      const items = conditions
        .map(([label, hit]) => `<li>${label}: ${hit ? "命中" : "未中"}</li>`)
        .join("");
      return `<details><summary>查看明细</summary><ul class="condition-list">${items}</ul></details>`;
    }

    function render() {
      const matches = getMatches();
      const messiScored = document.getElementById("messiScored").checked;
      const rows = [];
      let totalReturn = 0;

      tickets.forEach((ticket) => {
        const conditions = ticket.conditions(matches, messiScored);
        const allHit = conditions.every((condition) => condition[1]);
        const returnAmount = allHit ? ticket.stake * ticket.odds : 0;
        const net = returnAmount - ticket.stake;

        totalReturn += returnAmount;
        rows.push(`
          <tr>
            <td><strong>${ticket.name}</strong></td>
            <td>${statusBadge(allHit)}</td>
            <td>${money(returnAmount)}</td>
            <td>${money(ticket.stake)}</td>
            <td class="${net >= 0 ? "profit" : "loss"}">${money(net)}</td>
            <td>${conditionDetails(conditions)}</td>
          </tr>
        `);
      });

      const totalNet = totalReturn - TOTAL_STAKE;
      document.getElementById("resultsBody").innerHTML = rows.join("");
      document.getElementById("returnMetric").textContent = money(totalReturn);
      document.getElementById("netMetric").textContent = money(totalNet);
      document.getElementById("netMetric").className = totalNet >= 0 ? "profit" : "loss";
    }

    function resetScores() {
      fields.forEach((id) => {
        document.getElementById(id).value = 0;
      });
      document.getElementById("messiScored").checked = false;
      render();
    }

    fields.forEach((id) => {
      document.getElementById(id).addEventListener("input", render);
    });
    document.getElementById("messiScored").addEventListener("change", render);
    document.getElementById("calculateBtn").addEventListener("click", render);
    document.getElementById("resetBtn").addEventListener("click", resetScores);

    render();
  </script>
</body>
</html>
